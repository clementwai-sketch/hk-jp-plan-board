.delta-r{color:#fca5a5}
.act-sell{color:#fca5a5;font-weight:700}
.act-trim{color:#fcd34d;font-weight:700}
.act-hold{color:#86efac;font-weight:600}
.hi-red td{background:rgba(127,29,29,.18)!important}

.hi-elite{box-shadow:inset 0 0 0 1px #166534}

.flow-grid{display:grid;grid-template-columns:1fr;gap:.75rem}

.flow-title{font-size:.72rem;color:#cbd5e1;font-weight:600;padding:0 .55rem .3rem}

const {useState} = React;

const flagPill = (f) => ({RED:'pill-r', WATCH:'pill-y', SAFE:'pill-g', NEAR:'pill-y', ELEVATED:'pill-o'}[f] || 'pill-s');
const isElev = (s) => /elevated/i.test(String(s == null ? '' : s));
function ElevText({text}) {

  return parts.map((p, i) => isElev(p) ? <span key={i} className="pill pill-o">ELEVATED</span> : p);
}
const sslPill = (s) => {
  if (!s || s === '—') return 'pill-s';
  if (/Red/i.test(s)) return 'pill-r';
  if (/Blue/i.test(s)) return 'pill-b';

};
const actCls = (a) => {
  const u = (a || '').toUpperCase();

};
const rowMkt = (row) => String((row && row.mkt) || '').toUpperCase();

};

}
function pinStrip() {
  const rank = { JP: 0, HK: 1, US: 2 };

    if (String(r.status || '') !== 'breakout') return;

function asiaFill(v) {
  if (v > 0) return '#f87171';
  if (v < 0) return '#4ade80';
  return '#64748b';
}

function FlowBarChart({rows, field, title, unit, sortAbs, fmt}) {
  const data = (rows || []).filter((r) => r && Number.isFinite(+r[field]));
  if (!data.length) {
    return (
      <div className="flow-card">
        <div className="flow-title">{title}</div>
        <p className="text-xs text-slate-500 px-2 pb-2">No {field}.</p>
      </div>
    );
  }
  const sorted = data.slice().sort((a, b) => (
    sortAbs ? (Math.abs(+b[field]) - Math.abs(+a[field])) : (+b[field] - +a[field])
  ));
  const maxAbs = Math.max(0.01, ...sorted.map((r) => Math.abs(+r[field])));
  const W = 480;
  const labelW = 52;
  const rightPad = 62;
  const barH = 22;
  const top = 6;
  const plotW = W - labelW - rightPad;
  const H = top + sorted.length * barH + 22;
  const xOf = (v) => labelW + ((v + maxAbs) / (2 * maxAbs)) * plotW;
  const zero = xOf(0);
  const lab = (t) => {
    const s = String(t == null ? '' : t);
    return /^\d{5}$/.test(s) ? s.slice(1) : s;
  };
  return (
    <div className="flow-card">
      <div className="flow-title">{title}</div>
      <svg viewBox={'0 0 ' + W + ' ' + H} width="100%" height={H} role="img" aria-label={title}>
        <line x1={zero} y1={top} x2={zero} y2={top + sorted.length * barH} stroke="#334155" strokeWidth="1"/>
        {sorted.map((r, i) => {
          const v = +r[field];
          const y = top + i * barH + 4;
          const x = xOf(v);
          const xBar = Math.min(x, zero);
          const w = Math.max(1, Math.abs(x - zero));
          let labelX = v >= 0 ? x + 4 : x - 4;
          let anchor = v >= 0 ? 'start' : 'end';
          if (v < 0 && labelX < labelW + 2) {
            labelX = xBar + 6;
            anchor = 'start';
          }
          if (v >= 0 && labelX > W - 10) {
            labelX = x - 4;
            anchor = 'end';
          }
          return (
            <g key={(r.t || i) + '-' + field}>
              <text x={labelW - 8} y={y + 11} textAnchor="end" fill="#94a3b8" fontSize="11" fontFamily="Inter,system-ui,sans-serif">{lab(r.t)}</text>
              <rect x={xBar} y={y} width={w} height={14} rx="3" fill={asiaFill(v)}/>
              <text x={labelX} y={y + 11} textAnchor={anchor} fill="#e2e8f0" fontSize="10" fontFamily="Inter,system-ui,sans-serif">{fmt(v)}</text>
            </g>
          );
        })}
        <text x={zero} y={H - 6} textAnchor="middle" fill="#64748b" fontSize="10">0</text>
      </svg>
    </div>
  );
}

class DashboardErrorBoundary extends React.Component {

          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

                        {part.map((s) => (
                          <tr key={s.mkt + s.t} className={s.tone==='red'?'hi-red':s.tone==='amber'?'hi-amb':''}>
                            <td className="cover-hide">{s.rank}</td>
                            <td className="text-xs text-slate-500 cover-hide">{s.mkt}</td>
                            <td className="code">{s.t}</td>
                            <td className="cover-hide">{s.name}</td>
                            <td className="text-xs cover-hide">{s.stage}</td>
                            <td><span className={`pill ${sslPill(s.ssl)}`}>{s.ssl}</span></td>
                            <td><span className={`pill ${tonePill(s.tone)}`}>{s.act}</span></td>
                            <td className={`num ${deltaCls(s.dlt)} cover-hide`}>{pct(s.dlt)}</td>
                            <td className="text-xs text-slate-400 cover-hide">{s.note}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            />
            <div className="card p-3 mt-3">
              <div className="text-xs uppercase text-slate-500 mb-1">Avoid / caution for new risk</div>
              <ul className="text-sm text-slate-300 space-y-1">
                {(D.avoid || []).map((x, i) => <li key={i}>• {x}</li>)}
              </ul>
            </div>
          </Section>

          <Section title="Focus list" icon="fa-list-ol" defaultOpen={false}>
            <MktSplit
              mkt={mkt}
              rows={D.focus || []}
              render={(part) => (
                <div className="card p-3 space-y-2">
                  {part.map((f) => (
                    <div key={f.rank + f.t} className="flex gap-2 text-sm border-b border-slate-800 pb-2">
                      <span className="pill pill-b">{f.rank}</span>
                      <span className="pill pill-s">{f.mkt}</span>
                      <div><span className="code">{f.t}</span><div className="text-xs text-slate-400">{f.note}</div></div>
                    </div>
                  ))}
                </div>
              )}
            />
          </Section>
        </>
      )}



      {tab === 'risks' && (
        <>
          <Section title="Risks" icon="fa-shield-halved">
            <MktSplit
              mkt={mkt}
              rows={D.risks || []}
              render={(part) => (
                <div className="card p-3 space-y-2">
                  {part.map((r, i) => (
                    <div key={i} className="flex gap-2 items-start border-b border-slate-800 pb-2">
                      <span className={`pill ${tonePill(r.sev)}`}>{r.sev}</span>
                      <span className="pill pill-s">{r.mkt}</span>
                      <div>
                        <div className="text-sm font-medium text-slate-200"><ElevText text={r.risk}/></div>
                        <div className="text-xs text-slate-400">{r.act}</div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            />
          </Section>
          <Section title="Watch key" icon="fa-eye">
            <MktSplit
              mkt={mkt}
              rows={D.watch || []}
              render={(part) => (
                <div className="card p-3 space-y-2">
                  {part.map((w, i) => (
                    <div key={i} className="flex gap-2 text-sm">
                      <span className="pill pill-s">{w.mkt}</span>
                      <span className="code">{w.t}</span>
                      <span className="text-slate-400"><ElevText text={w.note}/></span>
                    </div>
                  ))}
                </div>
              )}
            />
          </Section>
          <Section title="Session clock" icon="fa-clock">
            <div className="card p-3 space-y-2">
              {(D.clock || []).map((c, i) => (
                <div key={i} className="flex gap-2 text-sm">
                  <span className="pill pill-s shrink-0">{c.t}</span>
                  <span className="text-slate-300">{c.task}</span>
                </div>
              ))}
            </div>
          </Section>
        </>
      )}

      <footer className="mt-8 text-xs text-slate-500 border-t border-slate-800 pt-4 leading-relaxed">
        {D.disclaimer} · {D.source}
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <DashboardErrorBoundary>
    <App />
  </DashboardErrorBoundary>
);

</script>
</body>
</html>
