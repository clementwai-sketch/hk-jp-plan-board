<script type="text/babel" data-presets="react">
const {useState} = React;
const D = window.__DATA__ || {};

const pct = (n, d=2) => {
  if (n == null || !Number.isFinite(+n)) return '—';
  const v = +n;
  return (v >= 0 ? '+' : '') + v.toFixed(d) + '%';
};
const num = (n, d=2) => {
  if (n == null || !Number.isFinite(+n)) return '—';
  return (+n).toLocaleString(undefined, {maximumFractionDigits: d});
};
const yen = (n) => {
  if (n == null || !Number.isFinite(+n)) return '—';
  const v = Math.round(+n);
  return (v > 0 ? '+' : '') + '¥' + v.toLocaleString();
};
const cls = (n) => {
  if (n == null || !Number.isFinite(+n)) return 'flat';
  return +n > 0.05 ? 'pos' : +n < -0.05 ? 'neg' : 'flat';
};
const deltaCls = (n) => {
  if (n == null || !Number.isFinite(+n)) return 'flat';
  const a = Math.abs(+n);
  if (a <= 1.5) return 'delta-g';
  if (a <= 3) return 'delta-y';
  return 'delta-r';
};
const tonePill = (t) => ({red:'pill-r', amber:'pill-y', orange:'pill-o', elevated:'pill-o', ELEVATED:'pill-o', green:'pill-g', blue:'pill-b', slate:'pill-s', CRITICAL:'pill-r', HIGH:'pill-r', MED:'pill-y'}[t] || 'pill-s');
const flagPill = (f) => ({RED:'pill-r', WATCH:'pill-y', SAFE:'pill-g', NEAR:'pill-y', ELEVATED:'pill-o'}[f] || 'pill-s');
const isElev = (s) => /elevated/i.test(String(s == null ? '' : s));
function ElevText({text}) {
  const s = String(text == null ? '' : text);
  if (!isElev(s)) return s;
  const parts = s.split(/(ELEVATED|elevated)/g);
  return parts.map((p, i) => isElev(p) ? <span key={i} className="pill pill-o">ELEVATED</span> : p);
}
const sslPill = (s) => {
  if (!s || s === '—') return 'pill-s';
  if (/Red/i.test(s)) return 'pill-r';
  if (/Blue/i.test(s)) return 'pill-b';
  return 'pill-s';
};
const actCls = (a) => {
  const u = (a || '').toUpperCase();
  if (u.includes('SELL') || u.includes('WRITE-OFF') || u.includes('EXIT')) return 'act-sell';
  if (u.includes('TRIM') || u.includes('MONITOR') || u.includes('WATCH') || u.includes('REDUCE')) return 'act-trim';
  return 'act-hold';
};
const rowMkt = (row) => String((row && row.mkt) || '').toUpperCase();
const rowsFor = (arr, k) => (arr || []).filter((r) => {
  const rm = rowMkt(r);
  return rm === k || rm === 'BOTH';
});
const viewMkts = (mkt, extra) => {
  if (mkt === 'ALL') return extra || ['HK', 'JP', 'US'];
  return [mkt];
};

function MktSplit({mkt, rows, render, empty, extra, keys}) {
  const ks = keys || viewMkts(mkt);
  const showLabel = ks.length > 1;
  return (
    <div className="space-y-3">
      {ks.map((k) => {
        let part = rowsFor(rows, k);
        if (extra) part = extra(part, k);
        return (
          <div key={k}>
            {showLabel ? (
              <div className="mkt-label">{k}<span className="mkt-count">{part.length}</span></div>
            ) : null}
            {part.length === 0 ? (
              empty ? empty(k) : <div className="card p-3 text-xs text-slate-500">No {k} rows.</div>
            ) : render(part, k)}
          </div>
        );
      })}
    </div>
  );
}

class DashboardErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = {error: null}; }
  static getDerivedStateFromError(error) { return {error}; }
  componentDidCatch(error, info) { try { console.error('Dashboard render error:', error, info); } catch (_) {} }
  render() {
    if (this.state.error) {
      const err = this.state.error;
      const msg = (err && err.message) ? String(err.message) : String(err);
      const stack = (err && err.stack) ? String(err.stack) : '';
      return (
        <div style={{minHeight:'100vh', background:'#020617', color:'#fecaca', padding:'1.5rem', fontFamily:'ui-monospace, SFMono-Regular, Menlo, monospace'}}>
          <div style={{maxWidth:'48rem', margin:'0 auto', border:'1px solid #7f1d1d', borderRadius:'1rem', background:'linear-gradient(180deg,#450a0a,#1c0a0a)', padding:'1.25rem 1.5rem', boxShadow:'0 10px 30px rgba(0,0,0,.45)'}}>
            <div style={{fontSize:'0.7rem', letterSpacing:'0.08em', textTransform:'uppercase', color:'#fca5a5', fontWeight:700, marginBottom:'0.5rem'}}>Dashboard render error</div>
            <div style={{fontSize:'1.1rem', fontWeight:700, color:'#fee2e2', marginBottom:'0.75rem'}}>{msg}</div>
            {stack ? <pre style={{whiteSpace:'pre-wrap', wordBreak:'break-word', fontSize:'0.7rem', color:'#fca5a5', opacity:0.9, background:'#0c0a09', padding:'0.75rem', borderRadius:'0.5rem', border:'1px solid #3f1f1f', maxHeight:'50vh', overflow:'auto'}}>{stack}</pre> : null}
            <p style={{marginTop:'1rem', fontSize:'0.75rem', color:'#94a3b8'}}>This page crashed while rendering. Usually a missing key on window.__DATA__ (e.g. D.watch.map when watch was omitted). Fix DATA or re-generate the dashboard.</p>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

                  <thead>
                    <tr>
                      <th>US</th><th className="num">Last</th><th className="num">vs prior</th>
                      <th className="num">Super+Big $M</th><th>Tag</th><th>JP/HK implication</th>
                    </tr>
                  </thead>
                  <tbody>
                    {(D.us_ovn || []).map((r) => (
                      <tr key={r.t} className={Math.abs(r.day||0)>3?'hi-red':''}>
                        <td className="code">{r.t}</td>
                        <td className="num">{num(r.last)}</td>
                        <td className={`num ${cls(r.day)}`}>{pct(r.day)}</td>
                        <td className={`num ${cls(r.sb)}`}>{r.sb != null ? ((r.sb>=0?'+':'')+Number(r.sb).toFixed(1)) : '—'}</td>
                        <td className="text-xs">{r.tag}</td>
                        <td className="text-xs text-slate-400">{r.note}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
            <p className="text-xs text-amber-200/90 p-2">{D.us_ovn_call}</p>
          </Section>
          <Section title="Mid-day snapshot" icon="fa-satellite-dish">
            <div className="card p-3 mb-2 flex flex-wrap items-center justify-between gap-2">
              <button type="button" className="nav-chip" onClick={() => setSnapOpen((o) => !o)}>{snapOpen ? 'Collapse' : 'Expand'} snapshot</button>
              <button type="button" className="nav-chip" onClick={refreshLive}><i className="fa-solid fa-rotate"/> Refresh Live</button>
              <span className="text-xs text-slate-500">{snapTs}</span>
            </div>
            {!connected && (
              <div className="card p-4 mb-3 border border-rose-900 text-rose-300 text-sm">OpenD not connected</div>
            )}
            {snapOpen && connected && (
              <>
                <MktSplit
                  mkt={mkt}
                  rows={D.indices || []}
                  keys={mkt === 'ALL' ? ['HK', 'JP', 'US'] : [mkt]}
                  empty={(k) => <div className="card p-3 text-xs text-slate-500">No {k} indices.</div>}
                  render={(part) => (
                    <div className="card overflow-hidden">
                      <div className="scroll-x">
                        <table>
                          <thead><tr><th>Index</th><th>Mkt</th><th className="num">Last</th><th className="num">Day%</th><th>Note</th></tr></thead>
                          <tbody>
                            {part.map((r) => (
                              <tr key={r.name}>
                                <td className="code">{r.name}</td>
                                <td className="text-xs text-slate-500">{r.mkt}</td>
                                <td className="num">{num(r.last, 2)}</td>
                                <td className={`num ${cls(r.chg_pct)}`}>{pct(r.chg_pct)}</td>
                                <td className="text-xs text-slate-400"><ElevText text={r.note}/></td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}
                />
                <div className="mt-3">
                  <MktSplit
                    mkt={mkt}
                    rows={D.snapshot || []}
                    render={(part) => (
                      <div className="card overflow-hidden">
                        <div className="scroll-x">
                          <table>
                            <thead>
                              <tr>
                                <th>T</th><th>Name</th><th className="num">Scan</th><th className="num">Live</th>
                                <th className="num">Day% / mark</th><th className="num">vs Scan Δ</th><th>Note</th>
                              </tr>
                            </thead>
                            <tbody>
                              {part.map((r) => (
                                <tr key={r.t} className={/285A|9903|5801|9984|5101/.test(r.t)?'hi-red':r.t==='01729'?'hi-amb':''}>
                                  <td className="code">{r.t}</td>
                                  <td>{r.name}</td>
                                  <td className="num">{num(r.scan)}</td>
                                  <td className="num">{num(r.live, r.t==='53249'?3:2)}</td>
                                  <td className={`num ${cls(r.day)}`}>{pct(r.day)}</td>
                                  <td className={`num ${deltaCls(r.dlt)}`}>{pct(r.dlt)}</td>
                                  <td className="text-xs text-slate-400"><ElevText text={r.note}/></td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}
                  />
                  <p className="text-xs text-slate-500 p-2">{D.snapshot_note} Δ vs Scan: green ≤1.5% · yellow 1.5–3% · red &gt;3%.</p>
                </div>
              </>
            )}
          </Section>



          <Section title="Regime gate" icon="fa-gauge-high">
            <div className={`grid gap-3 ${[showHk,showJp,showUs].filter(Boolean).length>1 ? 'sm:grid-cols-2 lg:grid-cols-3' : ''}`}>
              {showHk && (
                <div className="card p-4">
                  <div className="text-xs uppercase text-slate-500 mb-1">HK</div>
                  <div className="mb-2"><span className="pill pill-y">{D.hk_regime}</span> <span className="text-xs text-slate-500 ml-2">{D.session_hk}</span></div>
                  <ul className="text-sm text-slate-300 space-y-1">{(D.overview_hk || []).map((x,i)=>(<li key={i}>· <ElevText text={x}/></li>))}</ul>
                </div>
              )}
              {showJp && (
                <div className="card p-4">
                  <div className="text-xs uppercase text-slate-500 mb-1">JP</div>
                  <div className="mb-2"><span className={`pill ${tonePill(D.jp_regime_tone || "slate")}`}>{D.jp_regime}</span> <span className="text-xs text-slate-500 ml-2">{D.session_jp}</span></div>
                  <ul className="text-sm text-slate-300 space-y-1">{(D.overview_jp || []).map((x,i)=>(<li key={i}>· <ElevText text={x}/></li>))}</ul>
                </div>
              )}
              {showUs && (
                <div className="card p-4">
                  <div className="text-xs uppercase text-slate-500 mb-1">US</div>
                  <div className="mb-2"><span className={`pill ${tonePill(D.us_regime_tone || "amber")}`}>{D.us_regime}</span> <span className="text-xs text-slate-500 ml-2">{D.session_us}</span></div>
                  <ul className="text-sm text-slate-300 space-y-1">{(D.overview_us || []).map((x,i)=>(<li key={i}>· <ElevText text={x}/></li>))}</ul>
                  {D.half_size ? <p className="text-xs text-amber-200/90 mt-2">{D.half_size}</p> : null}
                </div>
              )}
            </div>
            <p className="text-xs text-amber-200/90 mt-2">{D.verdict}</p>
            {(D.cross_market || "") ? (
              <div className="mt-2 text-xs text-slate-400 border border-slate-800 rounded-lg px-3 py-2">{D.cross_market}</div>
            ) : null}
          </Section>

          <Section title="Macro header" icon="fa-globe">
            <div className="card p-4">
              <div className={`grid gap-3 text-sm ${macroGrid}`}>
                {macroKeys.map((k) => (
                  <div key={k}>
                    <div className="text-xs uppercase text-slate-500 mb-1">{k.toUpperCase()}</div>
                    <ul className="space-y-1">{((D.macro && D.macro[k]) || []).map((row,i) => (
                      <li key={i} className="flex justify-between gap-2 border-b border-slate-800/80 py-1">
                        <span className="text-slate-400">{row[0]}</span>
                        <span className="text-right"><span className="font-medium">{row[1]}</span> {isElev(row[2]) ? <span className="pill pill-o">ELEVATED</span> : <span className="text-xs text-slate-500">{row[2]}</span>}</span>
                      </li>
                    ))}</ul>
                  </div>
                ))}
              </div>
            </div>
          </Section>

          <Section title="Actionable (ranked)" icon="fa-bullseye">
            <MktSplit
              mkt={mkt}
              rows={D.actionable || []}
              render={(part) => (
                <div className="grid gap-2 sm:grid-cols-2">
                  {part.map((a) => (
                    <div key={a.rank + a.t} className="card p-3">
                      <div className="flex gap-2 items-center mb-1">
                        <span className="pill pill-b">#{a.rank}</span>
                        <span className="pill pill-s">{a.mkt}</span>
                      </div>
                      <div className="text-lg font-bold text-sky-300">{a.t}</div>
                      <div className="text-sm text-amber-100 mt-1">{a.act}</div>
                      <div className="text-xs text-slate-400 mt-1">{a.why}</div>
                    </div>
                  ))}
                </div>
              )}
            />
          </Section>
          <p className="text-xs text-slate-500">{D.bank_note}</p>
        </div>
      )}

      {tab === 'setups' && (
        <>
          <Section title="Elite / Prime VCP (Q ≥ 75 + CMF > 0)" icon="fa-crown">
            <MktSplit
              mkt={mkt}
              rows={D.elite || []}
              empty={(k) => (
                <div className="card p-4 text-sm text-amber-200">
                  <span className="pill pill-y mr-2">EMPTY</span>
                  {k === 'HK' ? (D.elite_note || 'No Elite names.') : 'No Elite names.'}
                </div>
              )}
              render={(part) => (
                <div className="card overflow-hidden">
                  <div className="scroll-x"><table>
                    <thead><tr><th>#</th><th>T</th><th className="num">Q</th><th>Note</th><th className="num">vs Scan Δ</th></tr></thead>
                    <tbody>{part.map((e) => (
                      <tr key={e.t} className="hi-elite">
                        <td>{e.rank}</td>
                        <td className="code">{e.t}</td>
                        <td className="num">{e.q}</td>
                        <td className="text-xs text-slate-400">{e.note}</td>
                        <td className={`num ${deltaCls(e.dlt)}`}>{pct(e.dlt)}</td>
                      </tr>
                    ))}</tbody>
                  </table></div>
                </div>
              )}
            />
          </Section>

          <Section title="Emerging VCP (Top 8)" icon="fa-seedling">
            <p className="text-xs text-slate-500 mb-2">{D.emerging_note}</p>
            <MktSplit
              mkt={mkt}
              rows={D.emerging || []}
              empty={(k) => (
                <div className="card p-4 text-sm text-slate-400">
                  <span className="pill pill-s mr-2">EMPTY</span>
                  No Emerging VCP for {k} today.
                </div>
              )}
              render={(part) => (
                <div className="card overflow-hidden">
                  <div className="scroll-x"><table>
                    <thead><tr><th>#</th><th>T</th><th>Name</th><th className="num">Wave</th><th className="num">To Pivot %</th><th>SSL</th><th className="num">CMF</th><th>Comment</th></tr></thead>
                    <tbody>{part.map((e) => (
                      <tr key={e.t}>
                        <td>{e.rank}</td>
                        <td className="code">{e.t}</td>
                        <td className="text-xs">{e.name}</td>
                        <td className="num">{e.wave}</td>
                        <td className="num">{e.to_pivot}</td>
                        <td><span className={`pill ${sslPill(e.ssl)}`}>{e.ssl}</span></td>
                        <td className={`num ${cls(e.cmf)}`}>{e.cmf}</td>
                        <td className="text-xs text-slate-400">{e.note}</td>
                      </tr>
                    ))}</tbody>
                  </table></div>
                </div>
              )}
            />
          </Section>


          <Section title="Cup-and-Handle (research / not a buy)" icon="fa-mug-hot">
            <p className="text-xs text-slate-500 mb-2">{D.cup_note}</p>
            <MktSplit
              mkt={mkt}
              rows={D.cup_handle || []}
              empty={(k) => (
                <div className="card p-4 text-sm text-slate-400">
                  <span className="pill pill-s mr-2">EMPTY</span>
                  No C&H for {k} today.
                </div>
              )}
              render={(part) => (
                <div className="card overflow-hidden">
                  <div className="scroll-x"><table>
                    <thead><tr><th>#</th><th>T</th><th>Name</th><th>Status</th><th className="num">Last</th><th className="num">Pivot</th><th className="num">Dist%</th><th>Comment</th></tr></thead>
                    <tbody>{part.map((e) => (
                      <tr key={e.status + e.t}>
                        <td>{e.rank}</td>
                        <td className="code">{e.t}</td>
                        <td className="text-xs">{e.name}</td>
                        <td><span className={`pill ${e.status==='breakout'?'pill-r':e.status==='near_pivot'?'pill-y':'pill-s'}`}>{e.status}</span></td>
                        <td className="num">{num(e.last)}</td>
                        <td className="num">{num(e.pivot)}</td>
                        <td className={`num ${cls(e.dist)}`}>{e.dist != null ? Number(e.dist).toFixed(2) : '—'}</td>
                        <td className="text-xs text-slate-400">{e.note}</td>
                      </tr>
                    ))}</tbody>
                  </table></div>
                </div>
              )}
            />
          </Section>

          <Section title="Strong / constructive setups" icon="fa-bolt">
            <div className="mb-2 flex flex-wrap gap-2">
            </div>
            <MktSplit
              mkt={mkt}
              rows={D.strong || []}
              render={(part) => (
                <div className="card overflow-hidden">
                  <div className="scroll-x">
                    <table>
                      <thead>
                        <tr>
                          <th>#</th><th>Mkt</th><th>T</th><th>Name</th><th>Stage</th><th>SSL</th>
                          <th>Action</th><th className="num">vs Scan Δ</th><th>Note</th>
                        </tr>
                      </thead>
                      <tbody>
                        {part.map((s) => (
                          <tr key={s.mkt + s.t} className={s.tone==='red'?'hi-red':s.tone==='amber'?'hi-amb':''}>
                            <td>{s.rank}</td>
                            <td className="text-xs text-slate-500">{s.mkt}</td>
                            <td className="code">{s.t}</td>
                            <td>{s.name}</td>
                            <td className="text-xs">{s.stage}</td>
                            <td><span className={`pill ${sslPill(s.ssl)}`}>{s.ssl}</span></td>
                            <td><span className={`pill ${tonePill(s.tone)}`}>{s.act}</span></td>
                            <td className={`num ${deltaCls(s.dlt)}`}>{pct(s.dlt)}</td>
                            <td className="text-xs text-slate-400">{s.note}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            />
            <div className="card p-3 mt-3">
              <div className="text-xs uppercase text-slate-500 mb-1">Avoid / caution for new risk</div>
              <ul className="text-sm text-slate-300 space-y-1">
                {(D.avoid || []).map((x, i) => <li key={i}>• {x}</li>)}
              </ul>
            </div>
          </Section>

          <Section title="Focus list" icon="fa-list-ol" defaultOpen={false}>
            <MktSplit
              mkt={mkt}
              rows={D.focus || []}
              render={(part) => (
                <div className="card p-3 space-y-2">
                  {part.map((f) => (
                    <div key={f.rank + f.t} className="flex gap-2 text-sm border-b border-slate-800 pb-2">
                      <span className="pill pill-b">{f.rank}</span>
                      <span className="pill pill-s">{f.mkt}</span>
                      <div><span className="code">{f.t}</span><div className="text-xs text-slate-400">{f.note}</div></div>
                    </div>
                  ))}
                </div>
              )}
            />
          </Section>
        </>
      )}



      {tab === 'risks' && (
        <>
          <Section title="Risks" icon="fa-shield-halved">
            <MktSplit
              mkt={mkt}
              rows={D.risks || []}
              render={(part) => (
                <div className="card p-3 space-y-2">
                  {part.map((r, i) => (
                    <div key={i} className="flex gap-2 items-start border-b border-slate-800 pb-2">
                      <span className={`pill ${tonePill(r.sev)}`}>{r.sev}</span>
                      <span className="pill pill-s">{r.mkt}</span>
                      <div>
                        <div className="text-sm font-medium text-slate-200"><ElevText text={r.risk}/></div>
                        <div className="text-xs text-slate-400">{r.act}</div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            />
          </Section>
          <Section title="Watch key" icon="fa-eye">
            <MktSplit
              mkt={mkt}
              rows={D.watch || []}
              render={(part) => (
                <div className="card p-3 space-y-2">
                  {part.map((w, i) => (
                    <div key={i} className="flex gap-2 text-sm">
                      <span className="pill pill-s">{w.mkt}</span>
                      <span className="code">{w.t}</span>
                      <span className="text-slate-400"><ElevText text={w.note}/></span>
                    </div>
                  ))}
                </div>
              )}
            />
          </Section>
          <Section title="Session clock" icon="fa-clock">
            <div className="card p-3 space-y-2">
              {(D.clock || []).map((c, i) => (
                <div key={i} className="flex gap-2 text-sm">
                  <span className="pill pill-s shrink-0">{c.t}</span>
                  <span className="text-slate-300">{c.task}</span>
                </div>
              ))}
            </div>
          </Section>
        </>
      )}

      <footer className="mt-8 text-xs text-slate-500 border-t border-slate-800 pt-4 leading-relaxed">
        {D.disclaimer} · {D.source}
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <DashboardErrorBoundary>
    <App />
  </DashboardErrorBoundary>
);

</script>
</body>
</html>
