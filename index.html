<style>
/* Fold layout. Folded (<560px) table rows are cards; at 560px or wider, full tables. */
:root{
  color-scheme:dark;
  --bg:#0a0f16; --panel:#111823; --panel-2:#16202e; --line:#223043; --fg:#e4ebf3; --muted:#8a9ab0; --faint:#5d6c80;
  --accent:#9d8cff; --accent-ink:#0a0f16;
  --up:#3fbf80; --down:#ef5a5f; --warn:#e8ad2e; --flow-in:#4ca3f0; --flow-out:#ef5a5f;
  --up-bg:rgba(63,191,128,.13); --down-bg:rgba(239,90,95,.13); --warn-bg:rgba(232,173,46,.14); --accent-bg:rgba(157,140,255,.14); --flow-bg:rgba(76,163,240,.13);
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f3f5f9; --panel:#ffffff; --panel-2:#f6f8fb; --line:#dde3ec; --fg:#111a26; --muted:#56657a; --faint:#8793a5;
  --accent:#5b45e0; --accent-ink:#ffffff;
  --up:#16804f; --down:#c9303a; --warn:#9a6700; --flow-in:#1f6fc0; --flow-out:#c9303a;
  --up-bg:rgba(22,128,79,.10); --down-bg:rgba(201,48,58,.09); --warn-bg:rgba(154,103,0,.10); --accent-bg:rgba(91,69,224,.09); --flow-bg:rgba(31,111,192,.09);
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f5f9; --panel:#ffffff; --panel-2:#f6f8fb; --line:#dde3ec; --fg:#111a26; --muted:#56657a; --faint:#8793a5;
  --accent:#5b45e0; --accent-ink:#ffffff;
  --up:#16804f; --down:#c9303a; --warn:#9a6700; --flow-in:#1f6fc0; --flow-out:#c9303a;
  --up-bg:rgba(22,128,79,.10); --down-bg:rgba(201,48,58,.09); --warn-bg:rgba(154,103,0,.10); --accent-bg:rgba(91,69,224,.09); --flow-bg:rgba(31,111,192,.09);
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);margin:0;-webkit-font-smoothing:antialiased}
.num,.tk,td.n{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-inline:14px;padding-block:0 32px;display:grid;gap:14px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:grid;gap:8px;border-bottom:1px solid var(--line);margin-inline:-14px;padding-inline:14px}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brand{font:700 19px/1.1 var(--f-disp);letter-spacing:.01em;margin:0}
.brand small{font:500 13px var(--f-body);color:var(--muted);margin-left:6px}
.asof{font:500 11px var(--f-data);color:var(--faint);white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.tabs button{appearance:none;border:0;background:transparent;color:var(--muted);font:600 13px var(--f-disp);letter-spacing:.06em;padding:7px 0;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;background:var(--t,var(--faint))}
.tone-red{--t:var(--down);--tb:var(--down-bg)} .tone-amber{--t:var(--warn);--tb:var(--warn-bg)} .tone-green{--t:var(--up);--tb:var(--up-bg)}
.today{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;display:grid;gap:10px}
.eyebrow{font:600 11px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.verdict{font:600 17px/1.3 var(--f-disp);margin:0;text-wrap:balance}
.regimes{display:grid;gap:0;border-top:1px solid var(--line)}
.rg{display:grid;grid-template-columns:34px auto 1fr;grid-template-areas:"m pill size" "m why why";column-gap:8px;row-gap:2px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.rg .m{grid-area:m;font:700 15px var(--f-disp);align-self:start;padding-top:1px}
.pill{grid-area:pill;justify-self:start;font:600 11px var(--f-disp);letter-spacing:.07em;color:var(--t);background:var(--tb);border-radius:5px;padding:2px 7px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.rg .size{grid-area:size;justify-self:end;font:600 12px var(--f-body);color:var(--fg);text-align:right}
.rg .why{grid-area:why;font-size:12.5px;color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{background:var(--panel-2);border-radius:8px;padding:7px 9px;min-width:0}
.fact b{display:block;font:600 10.5px var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fact > span{font-size:12.5px;display:block}
.fact.alert{box-shadow:inset 3px 0 0 var(--down)}
.fact.alert span .num{color:var(--down);font-weight:600}
section.block{display:grid;gap:8px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-inline:2px}
.sh h2{font:700 15px var(--f-disp);letter-spacing:.02em;margin:0}
.sh .cnt{font:500 11px var(--f-data);color:var(--faint)}
.note{font-size:12px;color:var(--faint);margin:0;padding-inline:2px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font:600 10.5px var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
.tbl td.n,.tbl th.n{text-align:right}
.tk{font-weight:600;font-size:13.5px;white-space:nowrap}
.mk{font:600 10px var(--f-disp);letter-spacing:.08em;color:var(--faint);margin-left:5px}
.nm{color:var(--muted);font-size:12px}
.act{font:600 11px var(--f-disp);letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:2px 7px;white-space:nowrap;display:inline-block;color:var(--t,var(--muted));background:var(--tb,var(--panel-2))}
.sev{font:700 10.5px var(--f-disp);letter-spacing:.08em;color:var(--t)}
.up{color:var(--up)} .down{color:var(--down)} .fin{color:var(--flow-in)} .fout{color:var(--flow-out)}
.tbl td.full.risk{color:var(--fg);font-size:13px}
.pend{color:var(--faint);font-style:italic;font-size:11.5px}
.qbar{display:inline-block;vertical-align:middle;width:46px;height:5px;border-radius:3px;background:var(--panel-2);margin-left:6px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.box.scroll{overflow-x:auto}
.more{display:grid;gap:8px}
.more details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.more summary{font:700 15px var(--f-disp);cursor:pointer}
.more details[open] summary{margin-bottom:8px}
.foot{font-size:12px;color:var(--faint);margin:0}
@media (max-width:559.98px){
  .tbl thead{display:none}
  .tbl,.tbl tbody{display:block}
  .tbl tr{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:3px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .tbl tr:last-child{border-bottom:0}
  .tbl td{display:block;padding:0;border:0}
  .tbl td.wide{display:none}
  .tbl td.a{grid-column:1} .tbl td.b{grid-column:2;justify-self:end;text-align:right}
  .tbl td.full{grid-column:1 / -1;color:var(--muted);font-size:12.5px}
  .tbl.sev-list tr{box-shadow:inset 3px 0 0 var(--t)}
  .facts{grid-template-columns:1fr;gap:0;border-top:1px solid var(--line);padding-top:4px}
  .fact{background:none;border-radius:0;padding:3px 0;display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:baseline}
  .fact.alert{box-shadow:none}
  .fact b{font-size:10px}
  .today{gap:8px;padding:10px 12px 8px}
  .verdict{font-size:16px}
  .rg{padding-block:6px}
  .rg .why{font-size:12px;line-height:1.35}
}
@media (min-width:560px){
  .wrap{padding-inline:18px} header.top{margin-inline:-18px;padding-inline:18px}
  .tbl td.b{text-align:left}
  .tbl.sev-list td:first-child{box-shadow:inset 3px 0 0 var(--t)}
  .facts{grid-template-columns:repeat(3,1fr)}
  .brand{font-size:21px}
  .only-n{display:none}
  .regimes{grid-template-columns:repeat(3,1fr);border-top:0;gap:8px}
  .rg{grid-template-columns:auto 1fr;grid-template-areas:"m pill" "size size" "why why";border:1px solid var(--line);border-radius:9px;padding:8px 10px;align-items:center}
  .rg .size{justify-self:start;text-align:left}
}
@media (prefers-reduced-motion:no-preference){.tabs button{transition:background .15s,color .15s}}
</style>
