<script type="text/babel" data-presets="react">
const {useState} = React;
const D = window.__DATA__ || {};

const pct = (n) => {
  if (n == null || !Number.isFinite(+n)) return '—';
  const v = +n;
  return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
};
const num = (n, d=2) => {
  if (n == null || !Number.isFinite(+n)) return '—';
  return (+n).toLocaleString(undefined, {maximumFractionDigits: d});
};
const cls = (n) => {
  if (n == null || !Number.isFinite(+n)) return 'flat';
  return +n > 0.05 ? 'pos' : +n < -0.05 ? 'neg' : 'flat';
};
const deltaCls = (n) => {
  if (n == null || !Number.isFinite(+n)) return 'flat';
  const a = Math.abs(+n);
  if (a <= 1.5) return 'delta-g';
  if (a <= 3) return 'delta-y';
  return 'delta-r';
};
const tonePill = (t) => ({red:'pill-r', amber:'pill-y', green:'pill-g', blue:'pill-b', slate:'pill-s'}[t] || 'pill-s');
const sslPill = (s) => {
  if (!s || s === '—' || s === 'None') return 'pill-s';
  if (/Red/i.test(s)) return 'pill-r';
  if (/Blue/i.test(s)) return 'pill-b';
  return 'pill-s';
};
const sevPill = (s) => (s === 'HIGH' ? 'pill-r' : (s === 'MED' || s === 'MEDIUM' ? 'pill-y' : 'pill-s'));
const agreePill = (s) => {
  if (s === 'Agree fully' || s === 'Agree' || s === 'Yes') return 'pill-g';
  if (s === 'Partial' || s === 'Partially agree') return 'pill-y';
  return 'pill-r';
};
const rowCls = (t, ssl, dlt) => {
  if (t === 'DDOG' || t === 'NBIS' || t === 'LITE') return 'hl-ddog';
  if (t === 'DELL') return 'hl-dell';
  if (t === 'PANW' || t === 'STX') return 'hl-elite';
  if (dlt != null && Number.isFinite(+dlt) && Math.abs(+dlt) > 3) return 'hl-gap';
  if (/Red/i.test(ssl || '')) return 'hl-redssl';
  return '';
};
const rowMkt = (r) => (r && r.mkt) ? r.mkt : 'US';
const filterMkt = (rows, mkt) => {
  const list = rows || [];
  if (mkt === 'US') return list.filter((r) => rowMkt(r) === 'US');
  if (mkt === 'HK') return list.filter((r) => rowMkt(r) === 'HK');
  if (mkt === 'JP') return list.filter((r) => rowMkt(r) === 'JP');
  return list;
};

class DashboardErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) {
    try { console.error('Dashboard render error:', error, info); } catch (_) {}
  }
  render() {
    if (this.state.error) {
      const err = this.state.error;
      const msg = (err && err.message) ? String(err.message) : String(err);
      const stack = (err && err.stack) ? String(err.stack) : '';
      return (
        <div style={{minHeight:'100vh',background:'#020617',color:'#fecaca',padding:'1.5rem',fontFamily:'ui-monospace, SFMono-Regular, Menlo, monospace'}}>
          <div style={{maxWidth:'48rem',margin:'0 auto',border:'1px solid #7f1d1d',borderRadius:'1rem',background:'linear-gradient(180deg,#450a0a,#1c0a0a)',padding:'1.25rem 1.5rem',boxShadow:'0 10px 30px rgba(0,0,0,.45)'}}>
            <div style={{fontSize:'0.7rem',letterSpacing:'0.08em',textTransform:'uppercase',color:'#fca5a5',fontWeight:700,marginBottom:'0.5rem'}}>Dashboard render error</div>
            <div style={{fontSize:'1.1rem',fontWeight:700,color:'#fee2e2',marginBottom:'0.75rem'}}>{msg}</div>
            {stack ? <pre style={{whiteSpace:'pre-wrap',wordBreak:'break-word',fontSize:'0.7rem',color:'#fca5a5',opacity:0.9,background:'#0c0a09',padding:'0.75rem',borderRadius:'0.5rem',border:'1px solid #3f1f1f',maxHeight:'50vh',overflow:'auto'}}>{stack}</pre> : null}
            <p style={{marginTop:'1rem',fontSize:'0.75rem',color:'#94a3b8'}}>This page crashed while rendering. Usually a missing key on window.__DATA__.</p>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function Section({title, icon, children, defaultOpen}) {
  const [open, setOpen] = useState(defaultOpen !== false);
  return (
    <section className="mb-5">
      <button type="button" onClick={() => setOpen((o) => !o)} className="w-full flex items-center justify-between text-left mb-2">
        <h2 className="text-lg font-semibold flex items-center gap-2 font-display">
          <i className={`fa-solid ${icon} text-sky-400 text-sm`}></i>{title}
        </h2>
        <i className={`fa-solid fa-chevron-${open ? 'up' : 'down'} text-slate-500 text-xs`}></i>
      </button>
      {open && children}
    </section>
  );
}

function EmptyMkt({mkt, label}) {
  return (
    <div className="card p-3 text-xs text-slate-500">
      No {mkt} rows on this US evening pack{label ? ` (${label})` : ''}.
    </div>

}

function MktBlocks({mkt, rows, label, renderRows}) {
  const blocks = mkt === 'Both' ? ['US', 'HK', 'JP'] : [mkt];
  return (
    <>
      {blocks.map((mk) => {
        const subset = filterMkt(rows, mk);
        return (
          <div key={mk} className="mb-3">
            {mkt === 'Both' && (
              <div className="mkt-label">{mk} <span className="mkt-count">{subset.length}</span></div>
            )}
            {subset.length === 0 ? <EmptyMkt mkt={mk} label={label} /> : renderRows(subset, mk)}
          </div>
        );
      })}
    </>
  );
}

                          <td className="text-sm">{r.value}</td>

                          <td className="text-xs">{r.trend}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <p className="text-xs text-slate-500 p-2">{D.macro_note}</p>
              </div>
            )}
          </Section>

          <Section title="Indices" icon="fa-chart-line" defaultOpen={false}>
            {showTables && (
              <MktBlocks mkt={mkt} rows={D.indices || []} label="indices" renderRows={(rows) => (
                <div className="card overflow-hidden"><div className="scroll-x"><table>
                  <thead><tr><th>Name</th><th className="num">Last</th><th className="num">Prior%</th><th className="num">Pre%</th><th>Note</th></tr></thead>
                  <tbody>{rows.map((r) => (
                    <tr key={r.name}>
                      <td className="code">{r.name}</td>
                      <td className="num">{num(r.last)}</td>
                      <td className={`num ${cls(r.chg_pct)}`}>{pct(r.chg_pct)}</td>
                      <td className={`num ${cls(r.pre_pct)}`}>{pct(r.pre_pct)}</td>
                      <td className="text-xs text-slate-400">{r.note}</td>
                    </tr>
                  ))}</tbody>
                </table></div></div>
              )} />
            )}
          </Section>
        </>
      )}

      {tab === 'sectors' && (
        <Section title="Sector rotation (Section G/H — US only)" icon="fa-layer-group">
          {mkt === 'JP' ? (
            <EmptyMkt mkt="JP" label="sector rotation" />
          ) : mkt === 'HK' ? (
            <div className="card p-3 text-xs text-slate-400">{D.cross_market}</div>
          ) : (
            <>
              {showTables && (
                <div className="card overflow-hidden mb-3">
                  <div className="scroll-x">
                    <table>
                      <thead><tr><th>#</th><th>ETF</th><th>Sector</th><th className="num">RS21</th><th>CMF</th><th>MA50</th><th>Bias</th></tr></thead>
                      <tbody>
                        {(D.sectors || []).map((s) => (
                          <tr key={s.etf}>
                            <td className="text-slate-500">{s.rank}</td>
                            <td className="code">{s.etf}</td>
                            <td>{s.sector}</td>
                            <td className="num font-semibold">{s.rs}</td>
                            <td className="num text-xs">{s.cmf}</td>
                            <td>{s.ma50 === true ? <span className="pill pill-g">Yes</span> : s.ma50 === false ? <span className="pill pill-r">No</span> : <span className="pill pill-s">—</span>}</td>
                            <td className="text-xs text-slate-400">{s.note}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                  <div className="p-2 text-xs text-rose-300/90 border-t border-slate-800">
                    Laggards (not ranked in table body as leaders): {(D.sectors_lag || []).map((s) => `${s.etf}${s.rs != null ? ' RS=' + s.rs : ''} · ${s.note}`).join(' · ')}
                  </div>
                  <div className="px-2 pb-2"><span className="pill pill-s text-[0.65rem]">{D.cross_market}</span></div>
                  <p className="text-xs text-slate-500 px-2 pb-2">{D.sector_takeaway}</p>
                </div>
              )}
            </>
          )}
        </Section>
      )}

      {tab === 'setups' && (
        <>
          <Section title={D.elite_title || "Prime VCP"} icon="fa-crown">
            {showTables && (
              <MktBlocks mkt={mkt} rows={D.elite || []} label="elite" renderRows={(rows) => (
                <div className="card overflow-hidden">
                  <div className="scroll-x">
                    <table>
                      <thead><tr><th>#</th><th>T</th><th className="num">Q</th><th className="num">To Pivot%</th><th className="num">RS</th><th>SSL</th><th>CMF</th><th className="num">Live Δ</th><th>Trap</th><th>Note</th></tr></thead>
                      <tbody>
                        {rows.map((e) => (
                          <tr key={e.t} className="hl-elite">
                            <td>{e.rank}</td>
                            <td className="code">{e.t}</td>
                            <td className="num font-bold text-emerald-300">{e.q}</td>
                            <td className="num">{e.pivot != null ? e.pivot : '—'}</td>
                            <td className="num">{e.rs}</td>
                            <td><span className={`pill ${sslPill(e.ssl)}`}>{e.ssl}</span></td>
                            <td className="text-xs">{e.cmf}</td>
                            <td className={`num ${deltaCls(e.dlt)}`}>{pct(e.dlt)}</td>
                            <td className="text-xs">{e.trap}</td>
                            <td className="text-xs text-slate-400">{e.note}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                  <p className="text-xs text-slate-500 p-2">{D.elite_note}</p>
                </div>
              )} />
            )}
          </Section>

          <Section title="Emerging VCP (Top 8)" icon="fa-seedling">
            <p className="text-xs text-slate-500 mb-2">{D.emerging_note}</p>
            {(D.emerging || []).length === 0 ? (
              <div className="card p-4 text-sm text-slate-400"><span className="pill pill-s mr-2">EMPTY</span> No Emerging VCP for US today.</div>
            ) : (
              <MktBlocks mkt={mkt} rows={D.emerging || []} label="emerging" renderRows={(rows) => (
                <div className="card overflow-hidden">
                  <div className="scroll-x">
                    <table>
                      <thead><tr><th>#</th><th>T</th><th className="num">Wave</th><th className="num">To Pivot %</th><th>SSL</th><th>CMF</th><th className="num">RS</th><th>Bounce Trap</th><th>Comment</th></tr></thead>
                      <tbody>
                        {rows.map((e) => (
                          <tr key={e.t}>
                            <td>{e.rank}</td>
                            <td className="code">{e.t}</td>
                            <td className="num">{e.wave != null ? e.wave : '—'}</td>
                            <td className="num">{e.pivot != null ? e.pivot : '—'}</td>
                            <td><span className={`pill ${sslPill(e.ssl)}`}>{e.ssl}</span></td>
                            <td className="text-xs">{e.cmf}</td>
                            <td className="num">{e.rs != null ? e.rs : '—'}</td>
                            <td className="text-xs">{e.trap || '—'}</td>
                            <td className="text-xs text-slate-400">{e.note}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )} />
            )}
          </Section>

          <Section title="Cup-and-Handle (research / not a buy)" icon="fa-mug-hot">
            <p className="text-xs text-slate-500 mb-2">{D.ch_note}</p>
            <MktBlocks mkt={mkt} rows={D.ch_hits || []} label="C&H hits" renderRows={(rows) => (
              <div className="card overflow-hidden mb-3">
                <div className="scroll-x">
                  <table>
                    <thead><tr><th>#</th><th>T</th><th>Status</th><th className="num">Last</th><th className="num">Pivot</th><th className="num">Dist%</th><th className="num">Depth%</th><th className="num">Cup d</th><th className="num">Handle d</th><th className="num">Vol50</th><th>Comment</th></tr></thead>
                    <tbody>
                      {rows.map((e) => (
                        <tr key={e.t}>
                          <td>{e.rank}</td>
                          <td className="code">{e.t}</td>
                          <td className="text-xs">{e.status}</td>
                          <td className="num">{num(e.last)}</td>
                          <td className="num">{num(e.pivot)}</td>
                          <td className="num">{e.dist != null ? e.dist : '—'}</td>
                          <td className="num">{e.depth != null ? e.depth : '—'}</td>
                          <td className="num">{e.cup != null ? e.cup : '—'}</td>
                          <td className="num">{e.handle != null ? e.handle : '—'}</td>
                          <td className="num">{e.vol50 != null ? e.vol50 : '—'}</td>
                          <td className="text-xs text-slate-400">{e.note}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )} />
            <MktBlocks mkt={mkt} rows={D.ch_eme || []} label="C&H emerging" renderRows={(rows) => (
              <div className="card overflow-hidden">
                <div className="scroll-x">
                  <table>
                    <thead><tr><th>#</th><th>T</th><th className="num">Last</th><th className="num">Pivot</th><th className="num">Dist%</th><th className="num">Depth%</th><th className="num">Cup d</th><th className="num">Handle d</th><th className="num">Vol50</th><th>Comment</th></tr></thead>
                    <tbody>
                      {rows.map((e) => (
                        <tr key={'eme-'+e.t}>
                          <td>{e.rank}</td>
                          <td className="code">{e.t}</td>
                          <td className="num">{num(e.last)}</td>
                          <td className="num">{num(e.pivot)}</td>
                          <td className="num">{e.dist != null ? e.dist : '—'}</td>
                          <td className="num">{e.depth != null ? e.depth : '—'}</td>
                          <td className="num">{e.cup != null ? e.cup : '—'}</td>
                          <td className="num">{e.handle != null ? e.handle : '—'}</td>
                          <td className="num">{e.vol50 != null ? e.vol50 : '—'}</td>
                          <td className="text-xs text-slate-400">{e.note}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )} />
          </Section>
          <Section title="Strong setups (Stage 2 + Blue + high RS)" icon="fa-bolt">
            {showTables && (
              <MktBlocks
                mkt={mkt}
                rows={D.strong || []}
                label="strong"
                renderRows={(rows) => (
                  <div className="card overflow-hidden">
                    <div className="scroll-x">
                      <table>
                        <thead><tr><th>#</th><th>T</th><th>Stage</th><th>SSL</th><th>CMF</th><th className="num">RS</th><th>Action</th><th className="num">Live Δ</th></tr></thead>
                        <tbody>
                          {rows.map((s) => (
                            <tr key={s.t + s.rank} className={rowCls(s.t, s.ssl, s.dlt)}>
                              <td>{s.rank}</td>
                              <td className="code">{s.t}</td>
                              <td className="text-xs">{s.stage}</td>
                              <td><span className={`pill ${sslPill(s.ssl)}`}>{s.ssl}</span></td>
                              <td className="text-xs">{s.cmf}</td>
                              <td className="num">{s.rs}</td>
                              <td><span className={`pill ${tonePill(s.tone)}`}>{s.act}</span></td>
                              <td className={`num ${deltaCls(s.dlt)}`}>{s.dlt_label || pct(s.dlt)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              />
            )}
            <div className="card p-3 mt-3">
              <div className="text-xs uppercase text-slate-500 mb-1">Do not add / Spring screen</div>
              <ul className="text-sm text-slate-300 space-y-1">
                {(D.avoid || []).map((x, i) => <li key={i}>• {x}</li>)}
              </ul>
            </div>
          </Section>
          <Section title="Watch VCPs / developing" icon="fa-binoculars" defaultOpen={false}>
            <MktBlocks mkt={mkt} rows={D.watch_vcp || []} label="watch VCP" renderRows={(rows) => (
              <div className="card p-3 space-y-2">
                {rows.map((w) => (
                  <div key={w.t} className="flex gap-2 text-sm border-b border-slate-800 pb-2">
                    <span className="code">{w.t}</span>
                    {w.q != null ? <span className="pill pill-s">Q{w.q}</span> : <span className="pill pill-s">—</span>}
                    <span className="text-xs text-slate-400">{w.note}</span>
                  </div>
                ))}
              </div>
            )} />
          </Section>
          <Section title="Core holdings (mandatory)" icon="fa-shield-halved" defaultOpen={false}>
            {showTables && (
              <MktBlocks mkt={mkt} rows={D.core || []} label="core" renderRows={(rows) => (
                <div className="card overflow-hidden">
                  <div className="scroll-x">
                    <table>
                      <thead><tr><th>T</th><th className="num">Scan</th><th>Live / Pre</th><th>Stage</th><th>SSL</th><th>CMF</th><th className="num">RS</th><th>MA40</th><th>Action</th><th className="num">Δ</th></tr></thead>
                      <tbody>
                        {rows.map((r) => (
                          <tr key={r.t} className={rowCls(r.t, r.ssl, r.dlt)}>
                            <td className="code">{r.t}</td>
                            <td className="num">{num(r.scan)}</td>
                            <td className="text-xs">{r.live}</td>
                            <td className="text-xs">{r.stage}</td>
                            <td><span className={`pill ${sslPill(r.ssl)}`}>{r.ssl}</span></td>
                            <td className="text-xs">{r.cmf}</td>
                            <td className="num">{r.rs != null ? r.rs : '—'}</td>
                            <td className="text-xs">{r.ma40}</td>
                            <td><span className={`pill ${tonePill(r.tone)}`}>{r.act}</span></td>
                            <td className={`num ${deltaCls(r.dlt)}`}>{pct(r.dlt)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )} />
            )}
          </Section>
          <Section title="Focus list" icon="fa-list-ol" defaultOpen={false}>
            <MktBlocks mkt={mkt} rows={D.focus || []} label="focus" renderRows={(rows) => (
              <div className="card p-3 space-y-2">
                {rows.map((f) => (
                  <div key={f.rank} className="flex gap-2 text-sm border-b border-slate-800 pb-2">
                    <span className="pill pill-b">{f.rank}</span>
                    <div>
                      <span className="code">{f.t}</span>
                      <span className="text-xs text-slate-500 ml-2">{f.level}</span>
                      <div className="text-xs text-slate-400">{f.note}</div>
                    </div>
                  </div>
                ))}
              </div>
            )} />
          </Section>
        </>
      )}



      {tab === 'risks' && (
        <>
          <Section title="Spring critical review" icon="fa-newspaper">
            {D.spring_skip ? (
              <div className="card p-3 text-sm text-slate-400">STEP 1 skipped — no Spring paste this run.</div>
            ) : (
              <>
                <div className="p-3 rounded-xl bg-rose-950/40 border border-rose-800/60 mb-3">
                  <div className="text-[0.65rem] uppercase tracking-wider text-rose-300 font-bold">Final verdict</div>
                  <div className="text-base font-semibold text-rose-100 mt-1">{D.spring_answer}</div>
                  <p className="text-xs text-rose-200/80 mt-1">{D.spring_detail}</p>
                </div>
                {showTables && (
                  <div className="card overflow-hidden">
                    <div className="scroll-x">
                      <table>
                        <thead><tr><th>Aspect</th><th>Spring</th><th>Critical view</th><th>Agree</th></tr></thead>
                        <tbody>
                          {(D.spring || []).map((s, i) => (
                            <tr key={i}>
                              <td className="text-sky-300 text-xs whitespace-nowrap">{s.aspect}</td>
                              <td className="text-xs text-slate-400">{s.summary}</td>
                              <td className="text-xs text-slate-300">{s.view}</td>
                              <td><span className={`pill ${agreePill(s.agree)}`}>{s.agree}</span></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </>
            )}
          </Section>
          <Section title="Risks" icon="fa-triangle-exclamation">
            <div className="card p-3 space-y-2">
              {(D.risks || []).map((r, i) => (
                <div key={i} className="flex gap-2 items-start border-b border-slate-800 pb-2">
                  <span className={`pill ${sevPill(r.sev)}`}>{r.sev}</span>
                  <div>
                    <div className="text-sm font-medium text-slate-200">{r.risk}</div>
                    <div className="text-xs text-slate-400">{r.act}</div>
                  </div>
                </div>
              ))}
            </div>
          </Section>
          <Section title="Session clock" icon="fa-clock">
            <div className="card p-3 space-y-2">
              {(D.clock || []).map((c, i) => (
                <div key={i} className="flex gap-2 text-sm">
                  <span className="pill pill-s shrink-0">{c.t}</span>
                  <span className="text-slate-300">{c.task}</span>
                </div>
              ))}
            </div>
          </Section>
          <Section title="Watch chips" icon="fa-thumbtack" defaultOpen={false}>
            <MktBlocks mkt={mkt} rows={D.watch || []} label="watch" renderRows={(rows) => (
              <div className="card p-3 space-y-2">
                {rows.map((w, i) => (
                  <div key={i} className="flex gap-2 text-sm">
                    <span className="code">{w.t}</span>
                    <span className="text-xs text-slate-400">{w.note}</span>
                  </div>
                ))}
              </div>
            )} />
          </Section>
          <p className="text-xs text-slate-500">{D.earnings_note}</p>
        </>
      )}

      <footer className="mt-6 pt-3 border-t border-slate-800 text-xs text-slate-500 leading-relaxed">
        {D.disclaimer} · {D.source} · {D.posture} · Bot2
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <DashboardErrorBoundary>
    <App />
  </DashboardErrorBoundary>
);
</script>
</body>
</html>
